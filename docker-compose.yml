# ---------------------------------------------------------------------------
# docker-compose.yml - Infrastructure as Code for the full stack.
#
# Services: database, api, web, zap, tests - on an isolated bridge network.
# docker-compose.override.yml adds local hot-reload and source mounts.
# ---------------------------------------------------------------------------
name: ecommerce_backoffice

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backoffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-backoffice}
    # Ephemeral by design: a tmpfs data dir means every pipeline run starts from
    # a clean, freshly seeded database. Local dev overrides this with a volume.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backoffice} -d ${POSTGRES_DB:-backoffice}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backoffice]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ecommerce-backoffice-api:${VERSION:-0.1.0}
    environment:
      VERSION: ${VERSION:-0.1.0}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      DEBUG: ${DEBUG:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      EXPOSE_DOCS: ${EXPOSE_DOCS:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://backoffice:change_me_local_only@database:5432/backoffice}
      JWT_SECRET: ${JWT_SECRET:-phase1b-demo-only-jwt-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backoffice]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; port=os.environ.get('API_PORT','8000'); sys.exit(0) if urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=2).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ecommerce-backoffice-web:${VERSION:-0.1.0}
    environment:
      VERSION: ${VERSION:-0.1.0}
      WEB_HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-8080}
      API_BASE_URL: http://api:8000
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-phase1b-demo-only-web-session-secret}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [backoffice]

  # OWASP ZAP - DAST proxy/scanner. Started on demand by the security runner and
  # by ci-dast; idle otherwise.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8090",
              "-config", "api.disablekey=true",
              "-config", "api.addrs.addr.name=.*",
              "-config", "api.addrs.addr.regex=true"]
    ports:
      - "${ZAP_PORT:-8090}:8090"
    networks: [backoffice]
    profiles: ["security"]

  # Test toolkit runner. One-shot; the runner scripts override the command.
  tests:
    build:
      context: .
      dockerfile: docker/tests.Dockerfile
    image: ecommerce-backoffice-tests:${VERSION:-0.1.0}
    environment:
      TOOLKIT_TRANSPORT: ${TOOLKIT_TRANSPORT:-http}
      TOOLKIT_BASE_URL: ${TOOLKIT_BASE_URL:-http://api:8000}
      WEB_BASE_URL: http://web:8080
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./reports:/reports
    networks: [backoffice]
    profiles: ["test"]

networks:
  backoffice:
    driver: bridge
