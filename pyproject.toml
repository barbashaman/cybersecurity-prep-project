[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-backoffice"
version = "0.1.0"
description = "Dockerized FastAPI + Jinja2 + PostgreSQL e-commerce backoffice SaaS with a DI-driven security test toolkit and DevSecOps pipelines (OWASP Top 10:2025 countdown portfolio)."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
authors = [{ name = "Matheus Barbachan" }]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.52.0",
    "jinja2==3.1.5",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.6",
    "mypy==2.3.0",
    "pre-commit==4.0.1",
    "import-linter==2.1",
]
test = [
    "pytest==9.1.1",
    "pytest-bdd==8.1.0",
    "pytest-cov==6.0.0",
    "pytest-html==4.1.1",
    "playwright==1.61.0",
    "robotframework==7.1.1",
    "junitparser==3.2.0",
]
security = [
    "bandit[toml]==1.8.0",
    "semgrep==1.99.0",
    "pip-audit==2.10.1",
    "cyclonedx-bom==5.1.1",
]

[project.urls]
Repository = "https://github.com/barbashaman/cybersecurity-prep-project"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_backoffice_api", "src/ecommerce_backoffice_web"]
artifacts = [
    "src/ecommerce_backoffice_web/templates/**/*.html",
    "src/ecommerce_backoffice_web/static/**/*",
]

# ---------------------------------------------------------------------------
# Ruff - lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["reports", ".venv", "database/migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming (no abbreviations / magic strings discipline)
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "S",             # flake8-bandit (defense in depth alongside bandit)
    "C4", "SIM", "RUF",
]
# Test suites may use assert and hard-coded fixtures.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"database/seeding/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = [
    "ecommerce_backoffice_api",
    "ecommerce_backoffice_web",
    "database",
]

# ---------------------------------------------------------------------------
# mypy - strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
mypy_path = "src:."
explicit_package_bases = true
exclude = ["reports/", "build/", "database/migrations/"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
# behaviour/ holds Gherkin only; e2e/ is Robot Framework, not pytest.
norecursedirs = ["tests/behaviour", "tests/e2e", "reports"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "api: API / integration tests (pytest-bdd + Playwright APIRequestContext)",
    "functional: scenario-focused persona-feature contract tests",
    "component: isolated use-case tests with mocked ports",
    "database: repository/model constraint and mapping tests",
    "integration: use-case + persistence (+ infra) integration tests",
    "performance: pragmatic SLO / latency assertions for critical paths",
    "performance_fast: PR-safe performance subset with generous thresholds",
    "performance_extended: longer-running performance profile (not PR-required)",
    "security: security-focused suites (ZAP-proxied, role matrix)",
    "smoke: fast subset run by the local pre-commit / quality gate",
]

# ---------------------------------------------------------------------------
# Bandit - SAST
# ---------------------------------------------------------------------------
[tool.bandit]
# Scan application source only; tests deliberately contain insecure fixtures.
exclude_dirs = ["tests", ".venv", "reports", "build", "database"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------------------
# import-linter - Clean Architecture dependency rule
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "ecommerce_backoffice_api",
    "ecommerce_backoffice_web",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is isolated from outer layers and frameworks"
type = "forbidden"
source_modules = [
    "ecommerce_backoffice_api.domain",
]
forbidden_modules = [
    "ecommerce_backoffice_api.application",
    "ecommerce_backoffice_api.infrastructure",
    "ecommerce_backoffice_api.presentation",
    "fastapi",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on infrastructure or presentation"
type = "forbidden"
source_modules = [
    "ecommerce_backoffice_api.application",
]
forbidden_modules = [
    "ecommerce_backoffice_api.infrastructure",
    "ecommerce_backoffice_api.presentation",
]

[[tool.importlinter.contracts]]
name = "Web does not import the API package"
type = "forbidden"
source_modules = [
    "ecommerce_backoffice_web",
]
forbidden_modules = [
    "ecommerce_backoffice_api",
]
