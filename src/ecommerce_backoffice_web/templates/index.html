<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Commerce Backoffice</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0;
           background: #0f172a; color: #e2e8f0; }
    main { max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; }
    h1 { font-size: 1.6rem; }
    .badge { display: inline-block; background: #1e293b; border: 1px solid #334155;
             border-radius: 999px; padding: .2rem .8rem; font-size: .85rem; }
    a { color: #38bdf8; }
    code { background: #1e293b; padding: .1rem .35rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Phase 1 bootstrap &middot; v{{ version }}</span>
    <h1>E-Commerce Backoffice</h1>
    <p>Operational baseline. The e-commerce features and the OWASP Top 10:2025
       countdown arrive in later phases.</p>
    <p>API contract: <a href="{{ api_base_url }}/docs"><code>{{ api_base_url }}/docs</code></a></p>
  </main>
</body>
</html>
