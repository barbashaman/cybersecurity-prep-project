name: ci-sast

on:
  push:
    branches: ["**"]
    tags: ["iter-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[sarif,toml]==1.8.0" "semgrep==1.99.0"

      - name: Prepare payload dir
        run: mkdir -p report-payload/security/bandit report-payload/security/semgrep

      # --- Bandit ---------------------------------------------------------
      - name: Bandit (SARIF)
        continue-on-error: true
        run: |
          bandit -c pyproject.toml -r src \
            -f sarif -o report-payload/security/bandit/bandit.sarif
      - name: Bandit (HTML evidence)
        continue-on-error: true
        run: |
          bandit -c pyproject.toml -r src \
            -f html -o report-payload/security/bandit/bandit.html || true

      # --- Semgrep --------------------------------------------------------
      - name: Semgrep (SARIF)
        continue-on-error: true
        run: |
          semgrep scan --config p/python --config p/security-audit \
            --sarif --output report-payload/security/semgrep/semgrep.sarif src || true

      # --- Upload to GitHub code scanning (needs Advanced Security; hedged) --
      - name: Upload Bandit SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report-payload/security/bandit/bandit.sarif
          category: bandit
      - name: Upload Semgrep SARIF to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report-payload/security/semgrep/semgrep.sarif
          category: semgrep

      - name: Manifest
        if: always()
        env:
          WORKFLOW: ci-sast
        run: |
          python -m tests.toolkit.reporting.unified_report \
            --report-dir report-payload \
            --out report-payload/tests/unified-dashboard.html \
            --manifest report-payload/manifest.json

      - name: Upload run artifact (Tier 1)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-sast-${{ github.run_number }}-${{ github.sha }}
          path: report-payload
          if-no-files-found: warn
          retention-days: 90

  publish-reports:
    needs: sast
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # See ci-quality-gate.yml: shared reports-publish concurrency cancels
    # pending publishes; rebase-retry in publish.sh serialises the push.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: reports-sast-${{ github.run_number }}-${{ github.sha }}
          path: report-payload
      - uses: ./.github/actions/publish-reports
        with:
          payload-dir: report-payload
