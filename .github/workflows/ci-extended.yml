name: ci-extended

# Nightly / on-demand extended pyramid: stack-backed functional API, Robot E2E,
# and performance_extended. Not required for merge; promote suites into
# ci-quality-gate once they stay green here.
on:
  schedule:
    - cron: "27 3 * * *" # daily 03:27 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/functional/**"
      - "tests/e2e/**"
      - "tests/performance/**"
      - "tests/api/**"
      - ".github/workflows/ci-extended.yml"
      - "docker-compose.yml"
      - "docker/**"

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TOOLKIT_BASE_URL: http://localhost:8000
  WEB_BASE_URL: http://localhost:8080
  # Robot + seeding imports need repo root (`database/`) and `src/` on sys.path.
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project (dev + test)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,test]"

      - name: Prepare payload dir
        run: mkdir -p report-payload/tests/pytest report-payload/tests/robot

      # Explicit -f docker-compose.yml so the local override (persistent volume,
      # hot-reload) is not applied; CI needs the ephemeral tmpfs database.
      - name: Build and start the stack (IaC)
        run: |
          docker compose -f docker-compose.yml build api web
          docker compose -f docker-compose.yml up -d database api web

      - name: Wait for API healthcheck (version gate)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "API healthy."; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy in time."; docker compose -f docker-compose.yml logs api; exit 1

      - name: Wait for Web health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "Web healthy."; exit 0
            fi
            sleep 3
          done
          echo "Web did not become healthy in time."; docker compose -f docker-compose.yml logs web; exit 1

      - name: Functional + API smoke (seeded stack)
        run: |
          pytest tests/functional tests/api \
            -m "functional or (api and smoke)" \
            --junitxml=report-payload/tests/pytest/functional-junit.xml \
            --html=report-payload/tests/pytest/functional-report.html --self-contained-html

      - name: Performance extended
        run: |
          pytest tests/performance -m performance_extended \
            --junitxml=report-payload/tests/pytest/performance-extended-junit.xml \
            --html=report-payload/tests/pytest/performance-extended-report.html --self-contained-html

      - name: E2E Robot (persona journeys)
        run: |
          robot --outputdir report-payload/tests/robot \
                --output output.xml --report report.html --log log.html \
                tests/e2e

      - name: Collect stack logs
        if: always()
        run: docker compose -f docker-compose.yml logs --no-color > report-payload/stack.log 2>&1 || true

      - name: Render unified dashboard + manifest
        if: always()
        env:
          WORKFLOW: ci-extended
        run: |
          python -m tests.toolkit.reporting.unified_report \
            --report-dir report-payload \
            --robot report-payload/tests/robot/output.xml \
            --junit report-payload/tests/pytest/functional-junit.xml \
            --junit report-payload/tests/pytest/performance-extended-junit.xml \
            --out report-payload/tests/unified-dashboard.html \
            --manifest report-payload/manifest.json

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v || true

      - name: Upload run artifact (Tier 1)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-extended-${{ github.run_number }}-${{ github.sha }}
          path: report-payload
          if-no-files-found: warn
          retention-days: 90

  publish-reports:
    needs: extended
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: reports-extended-${{ github.run_number }}-${{ github.sha }}
          path: report-payload
      - uses: ./.github/actions/publish-reports
        with:
          payload-dir: report-payload
