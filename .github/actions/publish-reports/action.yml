name: Publish reports
description: >
  Tier-2 publish of a run's report payload to the permanent, browsable
  `reports` archive branch (orphan branch, immutable per-run directory,
  regenerated index, rebase-retry push). Tier-1 per-run Actions artifacts are
  uploaded directly by each job with actions/upload-artifact.

inputs:
  payload-dir:
    description: Directory containing the run payload (must include manifest.json).
    required: true
  report-branch:
    description: Archive branch name.
    required: false
    default: reports

runs:
  using: composite
  steps:
    - name: Publish to reports archive branch (Tier 2)
      if: ${{ always() }}
      shell: bash
      env:
        PAYLOAD_DIR: ${{ inputs.payload-dir }}
        REPORT_BRANCH: ${{ inputs.report-branch }}
        ACTION_DIR: ${{ github.action_path }}
        RUN_ID: ${{ github.run_id }}
        FULL_SHA: ${{ github.sha }}
        SOURCE_BRANCH: ${{ github.ref_name }}
        WORKFLOW: ${{ github.workflow }}
        IS_PERMANENT: ${{ (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/iter-')) && 'true' || 'false' }}
      run: |
        export SHORT_SHA="${FULL_SHA:0:7}"
        bash "${ACTION_DIR}/publish.sh"
